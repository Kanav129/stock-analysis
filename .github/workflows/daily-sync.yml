# Daily price + news sync. Wakes the Render free dyno via HTTP.
#
# Repo secrets (Settings → Secrets and variables → Actions):
#   API_BASE_URL  — https://your-service.onrender.com  (no trailing slash, no /api)
#   ADMIN_KEY     — same as Render ADMIN_KEY

name: Daily sync

on:
  schedule:
    # 09:00 HKT daily (HKT = UTC+8)
    - cron: "0 1 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Wake dyno
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
        run: |
          set -euo pipefail
          BASE="${API_BASE_URL%/}"
          BASE="${BASE%/api}"
          for i in 1 2 3 4 5 6; do
            if curl -fsS --max-time 60 \
              -H "Authorization: Bearer ${ADMIN_KEY}" \
              "${BASE}/health"; then
              echo "API awake"
              exit 0
            fi
            echo "Waiting for cold start ($i)…"
            sleep 20
          done
          echo "Health check failed after retries" >&2
          echo "Check API_BASE_URL secret is your Render URL (not Vercel), e.g. https://xxx.onrender.com" >&2
          exit 1

      - name: Start sync
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
        run: |
          set -euo pipefail
          BASE="${API_BASE_URL%/}"
          BASE="${BASE%/api}"
          curl -fsS --max-time 120 \
            -X POST "${BASE}/cron/sync" \
            -H "Authorization: Bearer ${ADMIN_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}'

      - name: Wait until sync finishes
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
        run: |
          set -euo pipefail
          BASE="${API_BASE_URL%/}"
          BASE="${BASE%/api}"
          # Poll keeps the free dyno awake while the background job runs.
          for i in $(seq 1 120); do
            body=$(curl -fsS --max-time 60 \
              "${BASE}/sync/status" \
              -H "Authorization: Bearer ${ADMIN_KEY}")
            echo "$body"
            running=$(echo "$body" | python3 -c "import sys,json; print(json.load(sys.stdin).get('running', False))")
            status=$(echo "$body" | python3 -c "import sys,json; print(json.load(sys.stdin).get('status',''))")
            if [ "$running" != "True" ] && [ "$status" != "running" ]; then
              if [ "$status" = "error" ]; then
                echo "Sync failed" >&2
                exit 1
              fi
              echo "Sync finished with status=${status}"
              exit 0
            fi
            sleep 30
          done
          echo "Timed out waiting for sync" >&2
          exit 1
