# Daily price + news sync. Wakes the Render free dyno via HTTP.
#
# Repo secrets (Settings → Secrets and variables → Actions):
#   API_BASE_URL  — https://your-service.onrender.com  (no trailing slash, no /api)
#   ADMIN_KEY     — same as Render ADMIN_KEY
#
# Wait timeout is derived from ticker count × measured avg stage times (+20%),
# matching services/sync_service.compute_stage_timeouts().

name: Daily sync

on:
  schedule:
    # 06:00 HKT on Tue–Sat (after Mon–Fri US sessions).
    # Fires Mon–Fri 22:00 UTC (= next calendar day 06:00 HKT).
    # Skips Sun/Mon HKT mornings (US weekend — no new US equity session).
    - cron: "0 22 * * 1-5"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    # Ceiling for large universes; actual poll loop uses calculated timeout (~2h for 22 tickers).
    timeout-minutes: 240
    steps:
      - name: Weekend guard
        id: guard
        run: |
          set -euo pipefail
          # Manual runs always proceed. Scheduled runs skip Sun/Mon HKT
          # (US weekend — no new US equity session after Sat/Sun).
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          DOW=$(TZ=Asia/Hong_Kong date +%u)  # 1=Mon … 7=Sun
          echo "HKT weekday=$DOW ($(TZ=Asia/Hong_Kong date -Iseconds))"
          if [ "$DOW" = "7" ] || [ "$DOW" = "1" ]; then
            echo "US weekend (Sun/Mon HKT) — skipping scheduled daily sync"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Wake dyno
        if: steps.guard.outputs.skip != 'true'
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
        run: |
          set -euo pipefail
          BASE="${API_BASE_URL%/}"
          BASE="${BASE%/api}"
          for i in 1 2 3 4 5 6; do
            if curl -fsS --max-time 60 \
              -H "Authorization: Bearer ${ADMIN_KEY}" \
              "${BASE}/health"; then
              echo "API awake"
              exit 0
            fi
            echo "Waiting for cold start ($i)…"
            sleep 20
          done
          echo "Health check failed after retries" >&2
          echo "Check API_BASE_URL secret is your Render URL (not Vercel), e.g. https://xxx.onrender.com" >&2
          exit 1

      - name: Start sync
        id: start
        if: steps.guard.outputs.skip != 'true'
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
        run: |
          set -euo pipefail
          BASE="${API_BASE_URL%/}"
          BASE="${BASE%/api}"
          body=$(curl -fsS --max-time 120 \
            -X POST "${BASE}/cron/sync" \
            -H "Authorization: Bearer ${ADMIN_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "$body"

          # Same formula as services/sync_service.compute_stage_timeouts (defaults):
          # news=30s/ticker, prices=200s/ticker, buffer=1.2, vectors=600s, min stage=300s
          # Resume totals now include post-stage outcome/suggestions buffer.
          # Floor the Actions window so tiny resumes are not cut off mid-poll.
          SYNC_START_BODY="$body" python3 <<'PY'
          import json, math, os
          body = json.loads(os.environ["SYNC_START_BODY"])
          if body.get("reason") == "already_completed_today" or (
              body.get("started") is False and body.get("reason") == "already_completed_today"
          ):
              print(f"Already completed today ({body.get('date')}) — no-op success")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
                  fh.write("skip_wait=true\n")
                  fh.write("max_polls=0\n")
                  fh.write("poll_seconds=30\n")
                  fh.write("ticker_count=0\n")
              raise SystemExit(0)
          n = max(1, int(body.get("total") or len(body.get("tickers") or []) or 1))
          timeouts = body.get("timeouts") or {}
          if timeouts.get("total"):
              total_s = int(timeouts["total"])
              news_s = int(timeouts.get("news") or 0)
              prices_s = int(timeouts.get("prices") or 0)
          else:
              news_s = max(300, int(math.ceil(n * 30 * 1.2)))
              prices_s = max(300, int(math.ceil(n * 200 * 1.2)))
              total_s = news_s + prices_s + 600
          # Extra 10% on the Actions poll window beyond API timeouts
          wait_s = int(math.ceil(total_s * 1.1))
          # Tiny resumes (1 ticker left) used to get ~5m windows and time out
          # while the worker was still finishing — keep at least 20 minutes.
          wait_s = max(wait_s, 20 * 60)
          poll_s = 30
          max_polls = max(1, int(math.ceil(wait_s / poll_s)))
          print(f"Tickers={n} API timeouts news={news_s}s prices={prices_s}s total={total_s}s")
          print(f"Actions will poll up to {max_polls}×{poll_s}s ({wait_s}s)")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"max_polls={max_polls}\n")
              fh.write(f"poll_seconds={poll_s}\n")
              fh.write(f"ticker_count={n}\n")
          PY

      - name: Wait until sync finishes
        if: steps.guard.outputs.skip != 'true'
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          MAX_POLLS: ${{ steps.start.outputs.max_polls }}
          POLL_SECONDS: ${{ steps.start.outputs.poll_seconds }}
        run: |
          set -euo pipefail
          if [ "${{ steps.start.outputs.skip_wait }}" = "true" ]; then
            echo "Skipping wait — already completed today"
            exit 0
          fi
          BASE="${API_BASE_URL%/}"
          BASE="${BASE%/api}"
          MAX_POLLS="${MAX_POLLS:-240}"
          POLL_SECONDS="${POLL_SECONDS:-30}"
          RESUMES=0
          MAX_RESUMES=30
          TRANSIENT=0
          MAX_TRANSIENT=20
          echo "Polling /sync/status up to ${MAX_POLLS} times every ${POLL_SECONDS}s"
          # If Render restarts mid-run, in-memory status becomes idle but the
          # daily checkpoint still has remaining work — re-POST /cron/sync.
          # Transient edge errors (520/502/503/504/timeouts) must not abort the
          # wait loop while the sync job is still running on the dyno.
          for i in $(seq 1 "$MAX_POLLS"); do
            set +e
            raw=$(curl -sS --max-time 60 \
              -w "\nHTTP_STATUS:%{http_code}" \
              "${BASE}/sync/status" \
              -H "Authorization: Bearer ${ADMIN_KEY}" 2>&1)
            curl_rc=$?
            set -e
            http_code=$(printf '%s\n' "$raw" | sed -n 's/^HTTP_STATUS://p' | tail -n1)
            body=$(printf '%s\n' "$raw" | sed '/^HTTP_STATUS:/d')
            if [ "$curl_rc" -ne 0 ] || [ -z "$http_code" ] || [ "$http_code" -ge 500 ] || [ "$http_code" -eq 429 ]; then
              TRANSIENT=$((TRANSIENT + 1))
              echo "::warning::Transient poll failure ${TRANSIENT}/${MAX_TRANSIENT} (curl_rc=${curl_rc}, HTTP ${http_code:-n/a})"
              printf '%s\n' "$body" | tail -n 5
              if [ "$TRANSIENT" -ge "$MAX_TRANSIENT" ]; then
                echo "Too many consecutive transient poll failures" >&2
                exit 1
              fi
              # Nudge the free dyno awake; ignore failures.
              curl -sS --max-time 30 \
                -H "Authorization: Bearer ${ADMIN_KEY}" \
                "${BASE}/health" >/dev/null || true
              sleep "$POLL_SECONDS"
              continue
            fi
            if [ "$http_code" -ge 400 ]; then
              echo "Sync status returned HTTP ${http_code}" >&2
              printf '%s\n' "$body" >&2
              exit 1
            fi
            TRANSIENT=0
            echo "$body"
            eval "$(SYNC_BODY="$body" python3 <<'PY'
          import json, os
          d = json.loads(os.environ["SYNC_BODY"])
          daily = d.get("daily") or {}
          def sh(name, value):
              print(f'{name}={json.dumps(str(value))}')
          sh("running", d.get("running", False))
          sh("status", d.get("status", ""))
          sh("daily_status", daily.get("status", ""))
          sh("can_resume", bool(daily.get("can_resume")))
          sh("already_done", bool(daily.get("already_completed_today")))
          PY
          )"
            if [ "$already_done" = "True" ] || [ "$status" = "completed" ] || [ "$daily_status" = "completed" ]; then
              # Prefer daily completion over in-memory running: post-stages
              # (outcome/suggestions) may still be finishing after coverage is done.
              echo "Sync finished successfully"
              exit 0
            fi
            if [ "$running" = "True" ] || [ "$status" = "running" ]; then
              sleep "$POLL_SECONDS"
              continue
            fi
            if [ "$can_resume" = "True" ] || [ "$daily_status" = "partial" ] || [ "$daily_status" = "running" ]; then
              if [ "$RESUMES" -ge "$MAX_RESUMES" ]; then
                echo "Exceeded ${MAX_RESUMES} resume attempts (status=${status}, daily=${daily_status})" >&2
                exit 1
              fi
              RESUMES=$((RESUMES + 1))
              echo "Interrupted mid-sync — resume ${RESUMES}/${MAX_RESUMES}…"
              curl -sS --max-time 120 \
                -X POST "${BASE}/cron/sync" \
                -H "Authorization: Bearer ${ADMIN_KEY}" \
                -H "Content-Type: application/json" \
                -d '{}' || true
              sleep "$POLL_SECONDS"
              continue
            fi
            echo "Sync failed with status=${status}, daily.status=${daily_status}" >&2
            exit 1
          done
          echo "Timed out waiting for sync after ${MAX_POLLS} polls" >&2
          exit 1
