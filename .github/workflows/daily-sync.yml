# Daily price + news sync. Wakes the Render free dyno via HTTP.
#
# Repo secrets (Settings → Secrets and variables → Actions):
#   API_BASE_URL  — https://your-service.onrender.com  (no trailing slash)
#   ADMIN_KEY     — same as Render ADMIN_KEY

name: Daily sync

on:
  schedule:
    # 09:00 HKT daily (HKT = UTC+8)
    - cron: "0 1 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Wake dyno
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do
            if curl -fsS --max-time 30 "${API_BASE_URL}/health"; then
              echo "API awake"
              exit 0
            fi
            echo "Waiting for cold start ($i)…"
            sleep 20
          done
          echo "Health check failed after retries" >&2
          exit 1

      - name: Run sync
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
        run: |
          set -euo pipefail
          curl -fsS --max-time 1800 \
            -X POST "${API_BASE_URL}/cron/sync" \
            -H "Authorization: Bearer ${ADMIN_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}'
